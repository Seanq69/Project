<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Top 40 Movies Ever
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card *ngFor="let x of mySpace" style="text-align: center;">
    <img src={{x.small}}/>
    <ion-card-header>
      <ion-card-title>{{x.wikipedia}}</ion-card-title>
      <ion-card-subtitle>{{x.}}</ion-card-subtitle>
    </ion-card-header>
  
    <ion-card-content>
     
  
</ion-content>
